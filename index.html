
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM AI 创作大师</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101b;color:white;font-family:Arial;padding:18px}
header{padding:15px 0}
h1{color:#a995ff;font-size:28px}
.card{background:#202034;border:1px solid #393653;border-radius:16px;padding:18px;margin:14px 0}
textarea,select{width:100%;padding:13px;border-radius:10px;background:#151522;color:white;border:1px solid #555;font-size:15px;margin-top:7px}
textarea{height:110px}
button{width:100%;padding:14px;background:#8065ff;color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px}
button:disabled{opacity:.5}
#status{color:#c5b8ff;margin:15px 0;line-height:1.6}
#result{width:100%;border-radius:12px;margin-top:15px}
small{color:#aaa}
a{color:#c5b8ff}
</style>
</head>
<body>

<header>
<h1>✨ SAM AI 创作大师</h1>
<p>YOUR PERSONAL AI STUDIO</p>
</header>

<div class="card">
<h2>🖼️ AI 图片大师</h2>
<p>输入创意，选择风格，开始创作。</p>

<textarea id="prompt" placeholder="例如：一辆豪华跑车在未来城市"></textarea>

<p>图片风格</p>
<select id="style">
<option value="">自动选择</option>
<option value="photorealistic, highly detailed, realistic lighting">真实摄影</option>
<option value="3D render, octane render, cinematic">3D立体</option>
<option value="anime illustration, beautiful detailed art">动漫风格</option>
<option value="cinematic movie scene, dramatic lighting">电影风格</option>
<option value="professional commercial product advertising, premium design">产品广告</option>
<option value="fantasy digital art, magical atmosphere">奇幻艺术</option>
</select>

<p>图片比例</p>
<select id="ratio">
<option value="512,512">1:1 正方形</option>
<option value="768,448">16:9 横版</option>
<option value="448,768">9:16 竖版</option>
</select>

<p>生成数量</p>
<select id="count">
<option value="1">1 张</option>
<option value="2">2 张</option>
</select>

<button id="optimize">✨ 优化我的提示词</button>
<button id="generate">🎨 开始生成图片</button>

<p id="status">等待创作...</p>
<div id="results"></div>
</div>

<div class="card">
<h3>🎬 AI 视频</h3>
<p>下一阶段开发</p>
</div>

<div class="card">
<h3>🎞️ AI 短剧</h3>
<p>下一阶段开发</p>
</div>

<div class="card">
<h3>🎙️ AI 配音</h3>
<p>下一阶段开发</p>
</div>

<p style="text-align:center;color:#888">SAM AI STUDIO 2.0</p>

<script>
const API="https://aihorde.net/api/v2";

const headers={
 "Content-Type":"application/json",
 "apikey":"0000000000",
 "Client-Agent":"SamAIStudio:2.0:GitHub-samyeo7988Ai"
};

async function request(url,options={}){
 const res=await fetch(API+url,{
  ...options,
  headers:{...headers,...options.headers}
 });
 const data=await res.json();
 if(!res.ok) throw new Error(data.message||"API错误："+res.status);
 return data;
}

const btn=document.getElementById("generate");
const status=document.getElementById("status");
const results=document.getElementById("results");

document.getElementById("optimize").onclick=()=>{
 const prompt=document.getElementById("prompt");
 if(!prompt.value.trim()){
  alert("请先输入创意");
  return;
 }
 prompt.value=prompt.value.trim()+
 ", masterpiece, highly detailed, professional composition, beautiful lighting, high quality";
 status.textContent="提示词已优化！";
};

btn.onclick=async()=>{
 const original=document.getElementById("prompt").value.trim();
 if(!original){
  alert("请先输入图片描述");
  return;
 }

 const style=document.getElementById("style").value;
 const finalPrompt=original+(style?", "+style:"");
 const [width,height]=document.getElementById("ratio").value.split(",").map(Number);
 const count=Number(document.getElementById("count").value);

 btn.disabled=true;
 results.innerHTML="";
 status.textContent="正在提交任务...";

 try{
  const job=await request("/generate/async",{
   method:"POST",
   body:JSON.stringify({
    prompt:finalPrompt,
    params:{
     width:width,
     height:height,
     n:count,
     steps:20,
     cfg_scale:7
    },
    nsfw:false,
    censor_nsfw:true,
    r2:true
   })
  });

  if(!job.id) throw new Error("没有取得任务编号");

  status.textContent="任务已提交，正在等待免费 GPU...";

  let done=false;

  for(let i=0;i<180;i++){
   await new Promise(resolve=>setTimeout(resolve,3000));
   const check=await request("/generate/check/"+job.id);

   status.textContent="生成中... 已完成："+(check.finished||0)+
   "，排队中："+(check.waiting||0);

   if(check.done){
    done=true;
    break;
   }
  }

  if(!done) throw new Error("等待时间较长，请稍后重试");

  const data=await request("/generate/status/"+job.id);
  const generations=data.generations||[];

  if(!generations.length) throw new Error("没有取得图片");

  generations.forEach((item,index)=>{
   const image=item.img;
   if(!image)return;

   const box=document.createElement("div");
   box.style.marginTop="18px";

   const img=document.createElement("img");
   img.src=image;
   img.style.width="100%";
   img.style.borderRadius="12px";

   const link=document.createElement("a");
   link.href=image;
   link.target="_blank";
   link.textContent="打开图片并保存第 "+(index+1)+" 张";
   link.style.display="block";
   link.style.marginTop="10px";

   box.appendChild(img);
   box.appendChild(link);
   results.appendChild(box);
  });

  if(!results.children.length) throw new Error("没有取得有效图片");

  status.textContent="🎉 图片生成成功！";

 }catch(error){
  status.textContent="生成失败："+error.message;
 }finally{
  btn.disabled=false;
 }
};
</script>

</body>
</html>
