
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM AI 创作大师 3.0</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#10101b;
 color:white;
 font-family:Arial,sans-serif;
 padding:18px;
}

header{padding:15px 0}

h1{
 color:#a995ff;
 font-size:28px;
}

.card{
 background:#202034;
 border:1px solid #393653;
 border-radius:16px;
 padding:18px;
 margin:14px 0;
}

textarea,select{
 width:100%;
 padding:13px;
 border-radius:10px;
 background:#151522;
 color:white;
 border:1px solid #555;
 font-size:15px;
 margin-top:7px;
}

textarea{height:105px;resize:vertical}

button{
 width:100%;
 padding:14px;
 background:#8065ff;
 color:white;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 margin-top:10px;
 cursor:pointer;
}

button:disabled{opacity:.5}

#status{
 color:#c5b8ff;
 margin:15px 0;
 line-height:1.7;
}

.result-box{
 margin-top:20px;
 padding:12px;
 background:#151522;
 border-radius:12px;
}

.result-box img{
 width:100%;
 height:auto;
 border-radius:10px;
 display:block;
}

a{color:#c5b8ff}

small{color:#aaa}

.checkbox{
 display:flex;
 align-items:center;
 gap:10px;
 margin-top:15px;
}

.checkbox input{
 width:18px;
 height:18px;
}

.link{
 display:block;
 margin-top:12px;
 text-align:center;
 padding:12px;
 background:#302650;
 border-radius:8px;
 text-decoration:none;
}

.progress{
 height:7px;
 background:#393653;
 border-radius:10px;
 overflow:hidden;
 margin-top:10px;
}

#bar{
 width:0%;
 height:100%;
 background:#a995ff;
 transition:width .3s;
}

</style>
</head>

<body>

<header>
<h1>✨ SAM AI 创作大师</h1>
<p>YOUR PERSONAL AI STUDIO</p>
<small>SAM AI STUDIO 3.0 - HD EDITION</small>
</header>

<div class="card">

<h2>🖼️ AI 高清图片大师</h2>

<p>输入你的创意，开始制作高清图片。</p>

<textarea id="prompt"
placeholder="例如：一辆豪华跑车在未来城市，真实摄影风格"></textarea>

<p>负面提示词（避免不想要的画面）</p>

<textarea id="negative"
placeholder="例如：blurry, low quality, noise, pixelated, distorted details, bad anatomy"></textarea>

<p>图片风格</p>

<select id="style">
<option value="">自动选择</option>

<option value="photorealistic photography, realistic textures, natural lighting">
真实摄影
</option>

<option value="high quality 3D CGI render, realistic materials, detailed 3D objects">
3D立体
</option>

<option value="Japanese anime illustration, clean line art, detailed shading">
动漫风格
</option>

<option value="Hollywood cinematic film still, dramatic lighting, detailed scene">
电影风格
</option>

<option value="professional commercial advertising photography, premium product presentation">
产品广告
</option>

<option value="fantasy digital painting, magical atmosphere, detailed artwork">
奇幻艺术
</option>
</select>

<p>图片比例</p>

<select id="ratio">
<option value="768,768">1:1 高清正方形</option>
<option value="1024,576">16:9 高清横版</option>
<option value="576,1024">9:16 高清竖版</option>
</select>

<p>生成数量</p>

<select id="count">
<option value="1">1 张（推荐）</option>
<option value="2">2 张</option>
</select>

<div class="checkbox">
<input type="checkbox" id="upscale" checked>
<label for="upscale">启用 AI 高清放大处理</label>
</div>

<button id="optimize">
✨ 优化我的提示词
</button>

<button id="generate">
🎨 开始生成高清图片
</button>

<p id="status">等待创作...</p>

<div class="progress">
<div id="bar"></div>
</div>

<div id="results"></div>

</div>

<div class="card">
<h3>🎬 AI 视频</h3>
<p>下一阶段开发</p>
</div>

<div class="card">
<h3>🎞️ AI 短剧</h3>
<p>下一阶段开发</p>
</div>

<div class="card">
<h3>🎙️ AI 配音</h3>
<p>下一阶段开发</p>
</div>

<p style="text-align:center;color:#888">
SAM AI STUDIO 3.0
</p>

<script>

const API="https://aihorde.net/api/v2";

const headers={
 "Content-Type":"application/json",
 "apikey":"0000000000",
 "Client-Agent":"SamAIStudio:3.0:GitHub-samyeo7988Ai"
};

async function request(url,options={}){

 const res=await fetch(API+url,{
  ...options,
  headers:{
   ...headers,
   ...options.headers
  }
 });

 const data=await res.json();

 if(!res.ok){
  throw new Error(
   data.message ||
   "API错误："+res.status
  );
 }

 return data;
}

const btn=document.getElementById("generate");
const status=document.getElementById("status");
const results=document.getElementById("results");
const bar=document.getElementById("bar");

function setProgress(value){
 bar.style.width=Math.min(100,value)+"%";
}

document.getElementById("optimize").onclick=()=>{

 const prompt=document.getElementById("prompt");

 if(!prompt.value.trim()){
  alert("请先输入创意");
  return;
 }

 prompt.value=prompt.value.trim()+
 ", professional composition, realistic details, sharp focus, natural lighting, detailed textures, high quality photography";

 status.textContent="✨ 提示词优化成功！";
};

btn.onclick=async()=>{

 const original=
 document.getElementById("prompt").value.trim();

 const negative=
 document.getElementById("negative").value.trim();

 if(!original){
  alert("请先输入图片描述");
  return;
 }

 const style=
 document.getElementById("style").value;

 const quality=
 "sharp focus, clear details, realistic textures, detailed composition, balanced lighting";

 let finalPrompt=
 original+", "+style+", "+quality;

 if(negative){
  finalPrompt+=" ### "+negative;
 }

 const [width,height]=
 document.getElementById("ratio").value
 .split(",").map(Number);

 const count=
 Number(document.getElementById("count").value);

 const upscale=
 document.getElementById("upscale").checked;

 btn.disabled=true;
 results.innerHTML="";
 setProgress(0);

 status.textContent="正在提交图片任务...";

 try{

  const params={

   width:width,
   height:height,

   n:count,

   steps:30,

   cfg_scale:7,

   sampler_name:"k_euler",

   karras:true

  };

  if(upscale){
   params.post_processing=[
    "RealESRGAN_x4plus"
   ];
  }

  const job=await request(
   "/generate/async",
   {
    method:"POST",
    body:JSON.stringify({

     prompt:finalPrompt,

     params:params,

     nsfw:false,

     censor_nsfw:true,

     r2:true

    })
   }
  );

  if(!job.id){
   throw new Error("没有取得任务编号");
  }

  status.textContent=
   "任务已提交，正在等待 AI GPU...";

  let done=false;

  for(let i=0;i<180;i++){

   await new Promise(resolve=>
    setTimeout(resolve,3000)
   );

   const check=await request(
    "/generate/check/"+job.id
   );

   const finished=check.finished||0;

   const progress=Math.min(
    95,
    Math.round(finished/count*95)
   );

   setProgress(progress);

   status.textContent=
    "AI 正在创作... 已完成："+finished+
    " / "+count+
    "，排队中："+(check.waiting||0);

   if(check.done ||
      finished>=count){
    done=true;
    break;
   }

  }

  if(!done){
   throw new Error(
    "等待时间较长，请稍后重新尝试"
   );
  }

  status.textContent=
   "正在取得高清图片...";

  const data=await request(
   "/generate/status/"+job.id
  );

  const generations=
   data.generations||[];

  if(!generations.length){
   throw new Error("没有取得图片");
  }

  generations.forEach((item,index)=>{

   const image=item.img;

   if(!image)return;

   const box=document.createElement("div");

   box.className="result-box";

   const title=document.createElement("h3");

   title.textContent=
    "🎨 高清图片 "+(index+1);

   const img=document.createElement("img");

   img.src=image;
   img.alt="SAM AI generated image";

   img.loading="lazy";

   const info=document.createElement("p");

   info.style.color="#c5b8ff";
   info.textContent=
    "原始生成尺寸："+width+" × "+height+
    (upscale?
     " | 已请求 AI 放大处理":
     " | 未启用放大处理");

   const link=document.createElement("a");

   link.href=image;
   link.target="_blank";
   link.rel="noopener";

   link.className="link";

   link.textContent=
    "打开原图 / 保存图片 "+(index+1);

   box.appendChild(title);
   box.appendChild(img);
   box.appendChild(info);
   box.appendChild(link);

   results.appendChild(box);

  });

  if(!results.children.length){
   throw new Error("没有取得有效图片");
  }

  setProgress(100);

  status.textContent=
   "🎉 SAM AI 高清图片生成成功！";

 }catch(error){

  status.textContent=
   "❌ 生成失败："+error.message;

 }finally{

  btn.disabled=false;

 }

};

</script>

</body>
</html>
