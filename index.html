<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM AI 创作大师</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101b;color:white;font-family:Arial,sans-serif;padding:20px}
header{padding:22px 0}
h1{font-size:29px;margin:0;color:#a995ff}
p{color:#aaa}
.card{background:#202034;border:1px solid #393653;border-radius:17px;padding:20px;margin:14px 0}
button{background:#8065ff;color:white;border:0;padding:13px;border-radius:10px;width:100%;font-size:16px}
textarea{width:100%;height:110px;background:#151522;color:white;border:1px solid #555;border-radius:10px;padding:12px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<header>
<h1>SAM AI 创作大师</h1>
<p>YOUR PERSONAL AI STUDIO</p>
</header>
<div class="card">
<h2>🎬 AI 创作中心</h2>
<p>输入你的创意，开始制作作品</p>
<textarea id="prompt" placeholder="例如：一位英雄在未来城市中行走..."></textarea>
</div>
<div class="grid">
<div class="card">🎥<h3>AI 视频</h3><p>文字生成视频</p></div>
<div class="card">🖼️<h3>AI 图片</h3><p>创作高清图片</p></div>
<div class="card">🎞️<h3>AI 短剧</h3><p>制作故事分镜</p></div>
<div class="card">🧑‍🚀<h3>数字人</h3><p>人物口播创作</p></div>
<div class="card">🎙️<h3>AI 配音</h3><p>多语言声音</p></div>
<div class="card">✂️<h3>视频剪辑</h3><p>编辑你的影片</p></div>
</div>
<div class="card">
<h3>✨ 我的创作</h3>
<p>你的作品将在这里显示</p>
<button onclick="alert('AI生成接口将在下一阶段接入')">开始创作</button>
</div>
<p style="text-align:center;font-size:12px">SAM AI STUDIO · 1.0</p>
</body>
</html>
